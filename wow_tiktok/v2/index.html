<body><canvas id="c" width="1080" height="1920"></canvas>
<div style="font-family:Cinzel;font-weight:900;position:absolute;opacity:0">a</div>
<div style="font-family:Mont;font-weight:900;position:absolute;opacity:0">a</div>
<div style="font-family:Mont;font-weight:800;position:absolute;opacity:0">a</div>
<script>
'use strict';
const W = 1080, H = 1920, CX = 540;
const cv = document.getElementById('c'), X = cv.getContext('2d');
function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const OFF = mk(), O = OFF.getContext('2d');
let TL = null, SHAKE = 0, FLASH = 0, FLASHCOL = '255,240,210';

// ------------------------------------------------------------------ utils
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const eo = t => 1 - Math.pow(1 - clamp(t), 3);
const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eback = t => { t = clamp(t); const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const eexpo = t => { t = clamp(t); return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); };
function hit(t, et, dur = .4, amp = 30) { const k = (t - et) / dur; if (k >= 0 && k < 1) SHAKE += amp * (1 - k) * (1 - k); }
function flash(t, et, dur = .18, a = .8, col = '255,240,210') { const k = (t - et) / dur; if (k >= 0 && k < 1) { const v = a * (1 - k); if (v > FLASH) { FLASH = v; FLASHCOL = col; } } }

function glowSprite(r, g, b, size = 128) {
  const c = mk(size, size), x = c.getContext('2d');
  const gr = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(.25, `rgba(${r},${g},${b},.45)`);
  gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, size, size); return c;
}
const G_ORANGE = glowSprite(255, 150, 50), G_RED = glowSprite(255, 40, 40), G_WHITE = glowSprite(255, 245, 225),
  G_GREEN = glowSprite(120, 255, 140), G_BLUE = glowSprite(120, 190, 255), G_GOLD = glowSprite(255, 210, 90);
function glow(c, spr, x, y, r, a = 1) { if (a <= 0) return; c.globalAlpha = a; c.drawImage(spr, x - r, y - r, 2 * r, 2 * r); c.globalAlpha = 1; }

// ------------------------------------------------------------------ text helpers
function goldFill(c, y, size) {
  const g = c.createLinearGradient(0, y - size * .8, 0, y + size * .15);
  g.addColorStop(0, '#fff6c8'); g.addColorStop(.45, '#ffd257'); g.addColorStop(.75, '#e09a1c'); g.addColorStop(1, '#8a4f0a');
  return g;
}
function bigText(c, txt, x, y, size, o = {}) {
  const { scale = 1, alpha = 1, font = 'Cinzel', weight = 900, fill = null, stroke = '#1a0b00', sw = size * .05,
    glowCol = 'rgba(255,140,30,.85)', glowB = 40, rot = 0, skew = 0, spacing = 0, align = 'center' } = o;
  if (alpha <= 0.01 || scale <= 0.01) return;
  c.save(); c.translate(x, y); c.rotate(rot); if (skew) c.transform(1, 0, skew, 1, 0, 0); c.scale(scale, scale);
  c.globalAlpha = alpha; c.font = `${weight} ${size}px ${font}`; c.textAlign = align; c.textBaseline = 'alphabetic';
  if (spacing) c.letterSpacing = spacing + 'px';
  c.lineJoin = 'round';
  if (glowCol) { c.shadowColor = glowCol; c.shadowBlur = glowB; }
  c.fillStyle = fill || goldFill(c, 0, size);
  if (sw > 0) { c.strokeStyle = stroke; c.lineWidth = sw * 2; c.strokeText(txt, 0, 0); }
  c.shadowBlur = 0; c.fillText(txt, 0, 0);
  if (glowCol) { c.shadowColor = glowCol; c.shadowBlur = glowB * .6; c.globalAlpha = alpha * .5; c.fillText(txt, 0, 0); }
  c.restore();
}
// Buchstaben fliegen einzeln rein
function slamLetters(c, txt, x, y, size, t0, t, o = {}) {
  const { font = 'Mont', weight = 900, fill = '#ffe14d', stroke = '#000', stagger = .045, dur = .28, skew = -.18, glowCol = 'rgba(255,170,0,.8)', from = 3 } = o;
  c.save(); c.font = `${weight} ${size}px ${font}`;
  const widths = [...txt].map(ch => c.measureText(ch).width); const tw = widths.reduce((a, b) => a + b, 0);
  c.restore();
  let cx = x - tw / 2; const R = rng(txt.length * 97 + size);
  [...txt].forEach((ch, i) => {
    const k = (t - t0 - i * stagger) / dur; const rr = (R() - .5);
    if (k > 0) {
      const s = lerp(from, 1, eback(k)); const a = clamp(k * 3);
      bigText(c, ch, cx + widths[i] / 2, y, size, { font, weight, fill, stroke, sw: size * .07, scale: s, alpha: a, rot: rr * .5 * (1 - eo(k)), skew, glowCol, glowB: 30 });
    }
    cx += widths[i];
  });
}
function stamp(c, txt, x, y, t, t0, o = {}) {
  const { size = 110, col = '#ff3030', rot = -.12, w = null } = o;
  const k = (t - t0) / .16; if (k < 0) return;
  const s = lerp(2.6, 1, eo(k)), a = clamp(k * 2);
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s); c.globalAlpha = a;
  c.font = `900 ${size}px Mont`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const tw = w || c.measureText(txt).width + size * .6, th = size * 1.35;
  c.shadowColor = col; c.shadowBlur = 30;
  c.strokeStyle = col; c.lineWidth = size * .09;
  c.beginPath(); c.roundRect(-tw / 2, -th / 2, tw, th, size * .15); c.stroke();
  c.fillStyle = col; c.fillText(txt, 0, size * .05);
  c.shadowBlur = 0;
  // Grunge-Löcher
  c.globalCompositeOperation = 'destination-out'; const R = rng(txt.length * 31);
  for (let i = 0; i < 40; i++) { c.globalAlpha = .5 * R(); c.beginPath(); c.arc((R() - .5) * tw, (R() - .5) * th, 2 + R() * 6, 0, 7); c.fill(); }
  c.restore();
}
function header(c, t, lt, n, title, o = {}) {
  const { col = '#ffd257', glowCol = 'rgba(255,140,30,.8)', fill = null, glitch = false } = o;
  // Pill "FAKT n/5"
  const k = eo((lt - .05) / .35);
  c.save(); c.globalAlpha = k; c.translate(CX, 205 - 40 * (1 - k));
  c.font = '900 40px Mont'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const lbl = `FAKT ${n}/5`; const tw = c.measureText(lbl).width + 70;
  c.fillStyle = 'rgba(0,0,0,.55)'; c.strokeStyle = col; c.lineWidth = 4;
  c.beginPath(); c.roundRect(-tw / 2, -36, tw, 72, 36); c.fill(); c.stroke();
  c.fillStyle = col; c.fillText(lbl, 0, 2); c.restore();
  // Titel, Buchstabe für Buchstabe
  c.save(); c.font = '900 92px Cinzel'; c.letterSpacing = '4px';
  const chars = [...title]; const ws = chars.map(ch => c.measureText(ch).width + 4);
  let tot = ws.reduce((a, b) => a + b, 0); const sc = Math.min(1, 980 / tot); c.restore();
  let x = CX - tot * sc / 2;
  chars.forEach((ch, i) => {
    const kk = (lt - .2 - i * .035) / .3;
    if (kk > 0) {
      const jx = glitch && Math.sin(t * 40 + i) > .93 ? (Math.sin(i * 9 + t * 70) * 10) : 0;
      if (glitch && jx) { bigText(c, ch, x + ws[i] * sc / 2 + jx - 6, 340, 92 * sc, { fill: '#00e5ff', glowCol: null, sw: 0, alpha: .6 }); }
      bigText(c, ch, x + ws[i] * sc / 2 + jx, 340 + 30 * (1 - eo(kk)), 92 * sc, { alpha: clamp(kk * 2), fill, glowCol, sw: 5 });
    }
    x += ws[i] * sc;
  });
}

// ------------------------------------------------------------------ Landschaft
const RL = rng(42);
const STARS = [...Array(260)].map(() => ({ x: RL() * W, y: RL() * 1250, r: RL() * 2.3 + .4, p: RL() * 6.28, s: 1 + RL() * 3 }));
const LAYERS = [
  { base: 1060, amp: 170, col: '#4a2466', far: .15 },
  { base: 1190, amp: 150, col: '#2c1342', far: .3 },
  { base: 1330, amp: 120, col: '#190a29', far: .55 },
  { base: 1500, amp: 90, col: '#0b0414', far: 1 },
].map((L, i) => { const r = rng(100 + i); L.comp = [...Array(5)].map((_, k) => ({ f: (.002 + r() * .004) * (k + 1), ph: r() * 6.28, a: 1 / (k + 1) })); return L; });
function ridgeY(L, x) {
  let y = 0; for (const c of L.comp) y += c.a * Math.sin(c.f * x + c.ph);
  const peak = Math.abs(Math.sin(L.comp[0].f * 2.3 * x + L.comp[1].ph));
  return L.base - L.amp * (.45 * y + .9 * peak);
}
function drawDragon(c, x, y, s, ph, col = '#07020c') {
  c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = col;
  const f = Math.sin(ph);
  // ferner Flügel
  c.globalAlpha *= .85;
  c.beginPath(); c.moveTo(10, -6); c.quadraticCurveTo(0, -60 * f - 20, -30, -95 * f - 10); c.lineTo(-38, -40 * f); c.lineTo(-50, -55 * f + 5); c.lineTo(-52, -10 * f); c.closePath(); c.fill();
  c.globalAlpha /= .85;
  // Körper, Hals, Kopf, Schwanz
  c.beginPath(); c.moveTo(-60, 0);
  c.quadraticCurveTo(0, -16, 48, -6); c.quadraticCurveTo(66, -10, 80, -22);
  c.lineTo(104, -18); c.lineTo(90, -12); c.lineTo(100, -6); c.lineTo(82, -8);
  c.quadraticCurveTo(50, 12, -10, 10);
  c.quadraticCurveTo(-70, 16, -140, 26 + 10 * Math.sin(ph * .5)); c.lineTo(-150, 34 + 10 * Math.sin(ph * .5)); c.lineTo(-138, 22 + 10 * Math.sin(ph * .5));
  c.quadraticCurveTo(-90, 6, -60, 0); c.fill();
  // naher Flügel
  c.beginPath(); c.moveTo(25, -8); c.quadraticCurveTo(10, -90 * f - 30, -25, -150 * f - 10);
  c.lineTo(-30, -85 * f); c.lineTo(-55, -110 * f + 5); c.lineTo(-55, -55 * f); c.lineTo(-80, -60 * f + 10); c.lineTo(-30, 0); c.closePath(); c.fill();
  c.restore();
}
function drawCastle(c, x, gy, s, t) {
  c.save(); c.translate(x, gy); c.scale(s, s); c.fillStyle = '#0d0517';
  const towers = [[-120, 220, 40], [-60, 300, 55], [0, 380, 46], [70, 260, 50], [130, 190, 36]];
  c.fillRect(-150, -150, 300, 170);
  for (const [tx, th, tw] of towers) {
    c.fillRect(tx - tw / 2, -th, tw, th + 20);
    c.beginPath(); c.moveTo(tx - tw / 2 - 8, -th); c.lineTo(tx, -th - tw * 1.6); c.lineTo(tx + tw / 2 + 8, -th); c.fill();
  }
  // Fenster
  const R = rng(7);
  for (let i = 0; i < 16; i++) {
    const [tx, th, tw] = towers[i % 5]; const wy = -th + 30 + R() * (th - 60); const wx = tx + (R() - .5) * tw * .5;
    const fl = .6 + .4 * Math.sin(t * (3 + R() * 4) + i);
    glow(c, G_ORANGE, wx, wy, 26, .5 * fl);
    c.fillStyle = `rgba(255,${180 + 40 * fl | 0},90,${.9})`; c.fillRect(wx - 4, wy - 7, 8, 14); c.fillStyle = '#0d0517';
  }
  c.restore();
}
function drawEmbers(c, t, n, spr = G_ORANGE, seed = 5, speed = 1) {
  const R = rng(seed);
  for (let i = 0; i < n; i++) {
    const x0 = R() * W, y0 = R() * H, vy = (60 + R() * 180) * speed, ph = R() * 6.28, r = 6 + R() * 16;
    const y = ((y0 - vy * t) % (H + 100) + H + 100) % (H + 100) - 50;
    const x = x0 + 40 * Math.sin(t * 1.2 + ph);
    glow(c, spr, x, y, r, .5 + .5 * Math.sin(t * 5 + ph));
  }
}
function drawLandscape(c, t, o = {}) {
  const { zoom = 1, pan = 0, dragon = true, fogA = 1, embers = true } = o;
  c.save(); c.translate(CX, 1000); c.scale(zoom, zoom); c.translate(-CX, -1000);
  const sky = c.createLinearGradient(0, -200, 0, 1300);
  sky.addColorStop(0, '#05020f'); sky.addColorStop(.45, '#1d0b3a'); sky.addColorStop(.78, '#6a1f55'); sky.addColorStop(1, '#ff7b3a');
  c.fillStyle = sky; c.fillRect(-300, -300, W + 600, H + 600);
  for (const s of STARS) { const a = (.5 + .5 * Math.sin(t * s.s + s.p)) * (1 - s.y / 1300); c.globalAlpha = a; c.fillStyle = '#fff'; c.fillRect(s.x, s.y, s.r, s.r); }
  c.globalAlpha = 1;
  // Mond
  const mx = 770 - pan * .05, my = 430;
  glow(c, G_WHITE, mx, my, 420, .35); glow(c, G_GOLD, mx, my, 220, .4);
  c.fillStyle = '#ffeccc'; c.beginPath(); c.arc(mx, my, 125, 0, 7); c.fill();
  c.fillStyle = 'rgba(200,170,140,.35)';
  [[-40, -30, 26], [30, 20, 18], [10, -55, 12], [-20, 45, 16], [55, -15, 10]].forEach(([dx, dy, r]) => { c.beginPath(); c.arc(mx + dx, my + dy, r, 0, 7); c.fill(); });
  if (dragon) {
    const dt = (t % 9) / 9; const dx = lerp(-250, 1350, dt), dy = 520 - 140 * Math.sin(dt * 3.14) + 20 * Math.sin(t * 2);
    drawDragon(c, dx, dy, 1.3, t * 7);
  }
  // Horizont-Glühen
  const hg = c.createRadialGradient(CX, 1150, 50, CX, 1150, 900);
  hg.addColorStop(0, 'rgba(255,140,60,.55)'); hg.addColorStop(1, 'rgba(255,80,60,0)');
  c.fillStyle = hg; c.fillRect(-300, 300, W + 600, 1300);
  LAYERS.forEach((L, i) => {
    const off = pan * L.far + t * 12 * L.far;
    c.fillStyle = L.col; c.beginPath(); c.moveTo(-300, H + 300);
    for (let x = -300; x <= W + 300; x += 10) c.lineTo(x, ridgeY(L, x + off));
    c.lineTo(W + 300, H + 300); c.closePath(); c.fill();
    if (i === 2) { const cx = 300 - off * .0; drawCastle(c, cx, ridgeY(L, cx + off) + 30, 1.0, t); }
    // Nebel zwischen Ebenen
    if (fogA > 0 && i < 3) {
      for (let k = 0; k < 3; k++) {
        const fx = ((k * 500 + t * (20 + 10 * i)) % 1800) - 400, fy = L.base + 40;
        c.globalAlpha = .18 * fogA; c.drawImage(G_WHITE, fx - 500, fy - 90, 1000, 180); c.globalAlpha = 1;
      }
    }
  });
  c.restore();
  if (embers) drawEmbers(c, t, 45);
}

// ------------------------------------------------------------------ Szene: Hook
function sHook(c, t, lt, S) {
  drawLandscape(c, t, { zoom: 1.12 + .03 * lt, pan: lt * 40 });
  const k = (lt - .05) / .3;
  hit(lt, .35, .45, 50); flash(lt, .35, .2, .6);
  if (k > 0) {
    const s = lerp(4, 1, eo(k)) * (1 + .015 * Math.sin(lt * 5));
    bigText(c, 'WoW', CX, 700, 300, { scale: s, alpha: clamp(k * 3), glowB: 60, sw: 10 });
  }
  const sub = 'FAKTEN'; [...sub].forEach((ch, i) => {
    const kk = (lt - .55 - i * .05) / .25;
    if (kk > 0) bigText(c, ch, CX - 270 + i * 108, 840 + 25 * (1 - eo(kk)), 96, { alpha: clamp(kk * 2), fill: '#f5ecda', glowCol: 'rgba(160,90,255,.9)', sw: 4 });
  });
  const e = S.ev.erf - S.start; hit(lt, e, .4, 35);
  const l2 = S.lineStart[1] - S.start;
  if (lt < l2) stamp(c, 'ERFUNDEN?', CX, 1040, lt, e, { size: 100, col: '#ff3434', rot: -.1 });
  else { stamp(c, '100% WAHR', CX, 1040, lt, l2, { size: 100, col: '#4dff7a', rot: .08 }); hit(lt, l2, .35, 30); }
}

// ------------------------------------------------------------------ Szene: Seuche
const RP = rng(9);
const GROUND = (() => {
  const c = mk(2200, 2600), x = c.getContext('2d');
  x.fillStyle = '#1d1712'; x.fillRect(0, 0, 2200, 2600);
  for (let i = 0; i < 9000; i++) {
    const px = RP() * 2200, py = RP() * 2600, r = 10 + RP() * 16, l = 9 + RP() * 9;
    x.fillStyle = `hsl(30,12%,${l}%)`; x.beginPath(); x.ellipse(px, py, r, r * .75, RP() * 3, 0, 7); x.fill();
  }
  // Brunnen in der Mitte (Weltkoordinate 540+580, 1050+780)
  const fx = 1560, fy = 1480;
  x.fillStyle = '#3a3128'; x.beginPath(); x.arc(fx, fy, 170, 0, 7); x.fill();
  x.fillStyle = '#1b3a52'; x.beginPath(); x.arc(fx, fy, 130, 0, 7); x.fill();
  x.fillStyle = '#4a4036'; x.beginPath(); x.arc(fx, fy, 35, 0, 7); x.fill();
  // Häuserdächer am Rand
  for (let i = 0; i < 60; i++) {
    const side = i % 4; let rx, ry, rw = 200 + RP() * 160, rh = 200 + RP() * 160;
    if (side === 0) { rx = RP() * 2200; ry = RP() * 260; } else if (side === 1) { rx = RP() * 2200; ry = 2600 - RP() * 300; }
    else if (side === 2) { rx = RP() * 280 - 100; ry = RP() * 2600; } else { rx = 2200 - RP() * 280; ry = RP() * 2600; }
    x.fillStyle = `hsl(${10 + RP() * 20},35%,${14 + RP() * 8}%)`; x.fillRect(rx, ry, rw, rh);
    x.strokeStyle = 'rgba(0,0,0,.5)'; x.lineWidth = 6; x.beginPath(); x.moveTo(rx, ry + rh / 2); x.lineTo(rx + rw, ry + rh / 2); x.stroke();
  }
  return c;
})();
const AG = [...Array(300)].map((_, i) => {
  const a = i === 0 ? { x: 540, y: 1050 } : { x: -400 + RP() * 1880, y: 250 + RP() * 1700 };
  if (i > 0 && Math.hypot(a.x - 540, (a.y - 1050)) < 140) a.x += 220;
  const d = Math.hypot(a.x - 540, a.y - 1050);
  return { ...a, d, ti: i === 0 ? .5 : .7 + d / 420 + RP() * .4, w1: .5 + RP(), w2: .5 + RP(), p: RP() * 6.28, r: 11 + RP() * 4 };
});
function person(c, x, y, r, body, head) {
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(x + 4, y + 6, r * 1.5, r, 0, 0, 7); c.fill();
  c.fillStyle = body; c.beginPath(); c.ellipse(x, y, r * 1.5, r * .95, 0, 0, 7); c.fill();
  c.fillStyle = head; c.beginPath(); c.arc(x, y - 1, r * .7, 0, 7); c.fill();
}
function sPlague(c, t, lt, S) {
  const z = lerp(1.9, .9, eio((lt - .2) / 3.4));
  c.save(); c.translate(CX, 1050); c.scale(z, z); c.translate(-CX, -1050);
  c.drawImage(GROUND, 540 - 1120, 1050 - 1830);
  let inf = 0;
  for (const a of AG) {
    const x = a.x + 18 * Math.sin(lt * a.w1 + a.p), y = a.y + 14 * Math.cos(lt * a.w2 + a.p);
    const k = lt - a.ti;
    if (k < 0) person(c, x, y, a.r, '#c9b48a', '#e8d2a6');
    else if (k < 1.4) {
      inf++;
      const pulse = .6 + .4 * Math.sin(lt * 12 + a.p);
      c.globalCompositeOperation = 'lighter'; glow(c, G_RED, x, y, 50 + 20 * pulse, .9 * Math.min(1, k * 4)); c.globalCompositeOperation = 'source-over';
      person(c, x, y, a.r, '#b4ff3a', '#ff3b3b');
    } else {
      inf++;
      c.fillStyle = '#5a0d0d'; c.beginPath(); c.ellipse(x, y, a.r * 1.9, a.r * 1.2, a.p, 0, 7); c.fill();
      c.fillStyle = '#d8d0c0'; c.beginPath(); c.arc(x, y - 2, a.r * .55, 0, 7); c.fill();
      c.fillStyle = '#000'; c.fillRect(x - a.r * .3, y - 4, a.r * .2, a.r * .2); c.fillRect(x + a.r * .1, y - 4, a.r * .2, a.r * .2);
    }
  }
  // Infektionswelle
  for (let w = 0; w < 3; w++) {
    const r = (lt - .7 - w * .35) * 420; if (r > 0) {
      c.strokeStyle = `rgba(255,50,40,${clamp(.7 - r / 1600)})`; c.lineWidth = 14 / z + 6;
      c.beginPath(); c.arc(540, 1050, r, 0, 7); c.stroke();
    }
  }
  c.restore();
  // roter Puls-Rand
  const frac = inf / AG.length;
  const vg = c.createRadialGradient(CX, 1000, 300, CX, 1000, 1150);
  vg.addColorStop(0, 'rgba(255,0,0,0)'); vg.addColorStop(1, `rgba(200,0,0,${.75 * frac * (.75 + .25 * Math.sin(lt * 8))})`);
  c.fillStyle = vg; c.fillRect(0, 0, W, H);

  const lake = c.createLinearGradient(0, 1060, 0, H); lake.addColorStop(0, `rgb(${lerp(30, 90, red)},${lerp(28, 10, red)},${lerp(60, 15, red)})`); lake.addColorStop(1, '#03030a');
  c.fillStyle = lake; c.fillRect(-100, 1060, W + 200, H);
  for (let i = 0; i < 40; i++) {
    const y = 1080 + i * 18, w = (120 - i * 2) * (1 + .3 * Math.sin(t * 2 + i));
    c.fillStyle = `rgba(255,240,220,${.25 - i * .005})`; c.fillRect(260 - w / 2 + 15 * Math.sin(t * 1.5 + i * .7), y, w, 3);
  }
  // Ufer
  c.fillStyle = '#07050c'; c.fillRect(-100, 1040, W + 200, 40);
  // Trauernde mit Kerzen
  const N = 12;
  for (let i = 0; i < N; i++) {
    const x = 110 + i * 78, fall = ka > 0 ? eo((ka - .55 - i * .06) / .35) : 0;
    cloaked(c, x, 1045, 118 + (i % 3) * 8, '#0a0710', fall * 1.45, i % 2 === 0);
    if (!fall || fall < .5) { const fl = .7 + .3 * Math.sin(t * 13 + i * 2); glow(c, G_ORANGE, x + 30, 1035, 34 * fl, .9); c.fillStyle = '#ffe7a6'; c.fillRect(x + 28, 1022, 4, 10); }
  }
  // Glühwürmchen
  if (ka < 0) { const R = rng(31); for (let i = 0; i < 25; i++) { const x = R() * W, y = 700 + R() * 380; glow(c, G_GOLD, x + 30 * Math.sin(t * .7 + i), y + 20 * Math.cos(t * .9 + i), 14, .5 + .5 * Math.sin(t * 2 + i)); } }
  // Angreifer
  if (ka > 0) {
    for (let i = 0; i < 11; i++) {
      const tx = 120 + i * 85, sx = 1250 + i * 90;
      const x = lerp(sx, tx + 40, eo((ka - i * .03) / .8));
      attacker(c, x, 1050, 150, ka * 18 + i);
    }
  }
  c.restore();
  if (ka > 0) {
    hit(lt, ea, .6, 50); flash(lt, ea, .25, .85, '255,40,40');
    // Schwerthiebe
    [[.55, -.5], [.8, .45], [1.05, -.35], [1.3, .55]].forEach(([st, ang], i) => {
      const k = (ka - st) / .22; if (k < 0 || k > 1) return; hit(lt, ea + st, .2, 18);
      c.save(); c.translate(CX, 900 + i * 60); c.rotate(ang); c.globalAlpha = 1 - k;
      const g = c.createLinearGradient(-700, 0, 700, 0); g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(.5, '#fff'); g.addColorStop(1, 'rgba(255,0,0,0)');
      c.fillStyle = g; c.shadowColor = '#ff2020'; c.shadowBlur = 40; c.fillRect(-700 + 1400 * k - 700, -6, 1400, 12); c.restore();
    });
    stamp(c, 'HINTERHALT!', CX, 640, lt, ea + .1, { size: 105, col: '#ff2a2a', rot: -.07 });
    drawEmbers(c, t, 30, G_RED, 8, 1.6);
  }
  header(c, t, lt, 4, 'DIE TRAUERFEIER', ka > 0 ? {} : { fill: (() => { const g = c.createLinearGradient(0, -80, 0, 10); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#8ea2d6'); return g; })(), glowCol: 'rgba(120,150,255,.8)', col: '#b8c6ff' });
}

// ------------------------------------------------------------------ Szene: 20 Jahre
function sYears(c, t, lt, S) {
  const ek = S.ev.kids - S.start;
  if (lt < ek + .3) {
    c.fillStyle = '#020608'; c.fillRect(0, 0, W, H);
    const sp = lt < 2.3 ? 5 : 1.5;
    c.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 22; k++) {
      const z = ((k - lt * sp) % 22 + 22) % 22 * .25 + .12; const r = 380 / z;
      if (r > 2200) continue;
      const hue = lerp(170, 45, clamp(lt / 2.3));
      c.strokeStyle = `hsla(${hue + k * 3},90%,60%,${clamp(.9 - z / 5.5)})`; c.lineWidth = 14 / z;
      c.beginPath(); c.arc(CX, 800, r, 0, 7); c.stroke();
    }
    const R = rng(4);
    for (let i = 0; i < 90; i++) {
      const ang = R() * 6.28, ph = R(); const r0 = ((lt * (sp * .4) + ph) % 1) * 1300;
      c.strokeStyle = `rgba(180,255,240,${.5 * r0 / 1300})`; c.lineWidth = 3;
      c.beginPath(); c.moveTo(CX + Math.cos(ang) * r0, 800 + Math.sin(ang) * r0); c.lineTo(CX + Math.cos(ang) * r0 * 1.15, 800 + Math.sin(ang) * r0 * 1.15); c.stroke();
    }
    c.globalCompositeOperation = 'source-over';
    const p = eio((lt - .15) / 2.1); const yr = 2004 + 22 * p;
    c.save(); c.shadowColor = 'rgba(255,190,60,.9)'; c.shadowBlur = 60; odometer(c, p > .999 ? 2026 : yr, 4, CX, 880, 250, { sep: false, font: 'Cinzel' }); c.restore();
    if (lt > 2.3) { hit(lt, 2.3, .4, 30); flash(lt, 2.3, .15, .5); stamp(c, '20+ JAHRE', CX, 1080, lt, 2.3, { size: 100, col: '#4dffb0', rot: -.06 }); }
    header(c, t, lt, 5, 'IMMER NOCH DA');
  }
  if (lt >= ek) {
    const k = eo((lt - ek) / .3);
    c.save(); c.globalAlpha = k;
    c.fillStyle = '#05040a'; c.fillRect(0, 0, W, H);
    // Bildschirm mit Landschaft
    const sx = 110, sy = 430, sw = 860, sh = 520;
    const lg = c.createRadialGradient(CX, 700, 100, CX, 1000, 1200); lg.addColorStop(0, 'rgba(140,90,255,.45)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = lg; c.fillRect(0, 0, W, H);
    c.fillStyle = '#111'; c.beginPath(); c.roundRect(sx - 18, sy - 18, sw + 36, sh + 36, 18); c.fill();
    c.save(); c.beginPath(); c.rect(sx, sy, sw, sh); c.clip();
    c.translate(sx, sy); c.scale(sw / W, sw / W); c.translate(0, -560);
    drawLandscape(c, t, { zoom: 1.0, pan: lt * 60, embers: false });
    c.restore();
    // Sofa + zwei Silhouetten (Eltern + Kind)
    c.fillStyle = '#0b0912'; c.beginPath(); c.roundRect(60, 1180, 960, 320, 60); c.fill();
    const rim = 'rgba(170,130,255,.9)';
    const fig = (x, y, s, arm) => {
      c.save(); c.translate(x, y); c.scale(s, s); c.shadowColor = rim; c.shadowBlur = 25; c.fillStyle = '#020104';
      c.beginPath(); c.ellipse(0, 150, 150, 120, 0, Math.PI, 0); c.fill();
      c.beginPath(); c.arc(0, -10, 75, 0, 7); c.fill();
      if (arm) { c.lineCap = 'round'; c.lineWidth = 46; c.strokeStyle = '#020104'; c.beginPath(); c.moveTo(100, 90); c.lineTo(150, -20 + arm); c.lineTo(170, -110 + arm); c.stroke(); }
      c.restore();
    };
    fig(400, 1120, 1.0, 0);
    const cheer = Math.max(0, Math.sin((lt - ek) * 6)) * 30;
    fig(690, 1190, .72, -cheer);
    c.globalCompositeOperation = 'lighter'; const R = rng(12);
    for (let i = 0; i < 20; i++) { const ph = R(); const y = 950 - ((lt * .2 + ph) % 1) * 600; glow(c, G_GOLD, sx + R() * sw, y, 12, .6); }
    c.globalCompositeOperation = 'source-over';
    c.restore();
    if (lt > ek + .3) header(c, t, lt, 5, 'IMMER NOCH DA');
  }
}

// ------------------------------------------------------------------ Szene: Outro
function sOutro(c, t, lt, S) {
  drawLandscape(c, t, { zoom: 1.15 - .02 * lt, pan: 200 + lt * 40 });
  c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(0, 0, W, H);
  bigText(c, 'WELCHER FAKT', CX, 470, 104, { scale: lerp(2.5, 1, eback(lt / .35)), alpha: clamp(lt * 4), sw: 6 });
  bigText(c, 'WAR NEU FÜR DICH?', CX, 600, 80, { scale: lerp(2.5, 1, eback((lt - .15) / .35)), alpha: clamp((lt - .15) * 4), sw: 5, fill: '#f5ecda', glowCol: 'rgba(160,90,255,.9)' });
  hit(lt, .1, .3, 25);
  // Kommentar-Blase
  const kb = eback((lt - .5) / .4);
  if (kb > 0) {
    const by = 830 + 12 * Math.sin(lt * 4);
    c.save(); c.translate(CX, by); c.scale(kb, kb);
    c.fillStyle = '#fff'; c.shadowColor = 'rgba(255,255,255,.6)'; c.shadowBlur = 30;
    c.beginPath(); c.roundRect(-150, -85, 300, 160, 50); c.fill();
    c.beginPath(); c.moveTo(-60, 70); c.lineTo(-100, 125); c.lineTo(-10, 72); c.fill(); c.shadowBlur = 0;
    for (let i = 0; i < 3; i++) { const j = Math.max(0, Math.sin(lt * 9 - i * 1.1)); c.fillStyle = '#222'; c.beginPath(); c.arc(-70 + i * 70, -5 - 14 * j, 20, 0, 7); c.fill(); }
    c.restore();
  }
  // Folgen-Button
  const ef = S.ev.follow - S.start, kf = lt - (ef - .4);
  if (kf > 0) {
    const tap = ef + .35, done = lt > tap;
    const s = eback(kf / .35) * (done ? 1 + .12 * Math.max(0, 1 - (lt - tap) / .25) : 1 + .04 * Math.sin(lt * 10));
    c.save(); c.translate(CX, 1080); c.scale(s, s);
    c.fillStyle = done ? '#2be07a' : '#ff2d55'; c.shadowColor = c.fillStyle; c.shadowBlur = 40;
    c.beginPath(); c.roundRect(-260, -70, 520, 140, 70); c.fill(); c.shadowBlur = 0;
    c.fillStyle = '#fff'; c.font = '900 64px Mont'; c.textAlign = 'center'; c.textBaseline = 'middle';
    if (done) {
      c.lineWidth = 14; c.strokeStyle = '#fff'; c.lineCap = 'round'; c.beginPath(); c.moveTo(-200, 0); c.lineTo(-170, 30); c.lineTo(-120, -30); c.stroke();
      c.fillText('GEFOLGT', 40, 4);
    } else c.fillText('+ FOLGEN', 0, 4);
    c.restore();
    // Finger-Tap + Ripple
    if (lt > tap - .3 && lt < tap + .8) {
      const fk = clamp((lt - (tap - .3)) / .3);
      const fx = CX + 120, fy = lerp(1300, 1110, eo(fk));
      for (let r = 0; r < 2; r++) { const rk = (lt - tap - r * .12) / .5; if (rk > 0 && rk < 1) { c.strokeStyle = `rgba(255,255,255,${1 - rk})`; c.lineWidth = 8; c.beginPath(); c.arc(fx, 1110, 40 + 160 * rk, 0, 7); c.stroke(); } }
      c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(fx, fy, 36, 0, 7); c.fill();
      c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 5; c.stroke();
    }
    hit(lt, tap, .25, 15); flash(lt, tap, .12, .3);
  }
}

// ------------------------------------------------------------------ Untertitel
let CHUNKS = [];
function buildChunks() {
  CHUNKS = TL.scenes.map(sc => {
    const out = []; let cur = [];
    sc.words.forEach((w, i) => {
      if (cur.length && (cur.length >= 3 || cur[cur.length - 1].end || cur[cur.length - 1].line !== w.line)) { out.push(cur); cur = []; }
      cur.push(w);
    });
    if (cur.length) out.push(cur);
    return out;
  });
  TL.scenes.forEach(sc => {
    sc.lineStart = []; sc.words.forEach(w => { if (sc.lineStart[w.line] === undefined) sc.lineStart[w.line] = w.t0; });
  });
}
function drawCaptions(c, t, si) {
  const chunks = CHUNKS[si]; const sc = TL.scenes[si];
  let ci = -1; for (let i = 0; i < chunks.length; i++) if (t >= chunks[i][0].t0 - .04) ci = i;
  if (ci < 0) return;
  const ch = chunks[ci]; const last = ch[ch.length - 1];
  if (ci === chunks.length - 1 && t > last.t1 + .5) return;
  const size = 82; c.save(); c.font = `900 ${size}px Mont`;
  const words = ch.map(w => w.w.toUpperCase());
  const sp = 42; const ws = words.map(w => c.measureText(w).width);
  // Zeilen umbrechen
  const lines = [[]]; let lw = 0; const maxW = 860;
  words.forEach((w, i) => { if (lw + ws[i] > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(i); lw += ws[i] + sp; });
  const y0 = 1330 - (lines.length - 1) * 50;
  c.lineJoin = 'round'; c.textBaseline = 'middle'; c.textAlign = 'center';
  lines.forEach((ln, li) => {
    const tot = ln.reduce((a, i) => a + ws[i], 0) + sp * (ln.length - 1);
    let x = CX - tot / 2; const y = y0 + li * 100;
    ln.forEach(i => {
      const w = ch[i]; const k = (t - w.t0 + .04) / .16;
      if (k > 0) {
        const active = t >= w.t0 - .04 && t < w.t1 + .02;
        const s = lerp(.5, 1, eback(k)) * (active ? 1.1 : 1);
        c.save(); c.translate(x + ws[i] / 2, y + (active ? -6 : 0)); c.scale(s, s); c.rotate(active ? -.025 : 0);
        c.shadowColor = 'rgba(0,0,0,.7)'; c.shadowBlur = 20; c.shadowOffsetY = 8;
        c.strokeStyle = '#000'; c.lineWidth = 18; c.strokeText(words[i], 0, 0);
        c.shadowColor = 'transparent';
        c.fillStyle = active ? '#ffe14d' : (w.emph ? '#ff5a3c' : '#ffffff');
        if (w.emph && active) c.fillStyle = '#4dffb0';
        c.fillText(words[i], 0, 0); c.restore();
      }
      x += ws[i] + sp;
    });
  });
  c.restore();
}

// ------------------------------------------------------------------ Post
const VIGN = (() => { const c = mk(), x = c.getContext('2d'); const g = x.createRadialGradient(CX, 960, 500, CX, 960, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)'); x.fillStyle = g; x.fillRect(0, 0, W, H); return c; })();
const GRAIN = [0, 1, 2].map(s => { const c = mk(540, 960), x = c.getContext('2d'); const d = x.createImageData(540, 960); const R = rng(s + 50); for (let i = 0; i < d.data.length; i += 4) { const v = R() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });

const SCENES = { hook: sHook, plague: sPlague, leeroy: sLeeroy, subs: sSubs, funeral: sFuneral, years: sYears, outro: sOutro };
window.setTimeline = (tl) => { TL = tl; buildChunks(); };
window.renderFrame = (t) => {
  SHAKE = 0; FLASH = 0;
  let si = TL.scenes.length - 1; for (let i = 0; i < TL.scenes.length; i++) if (t >= TL.scenes[i].start) si = i;
  const S = TL.scenes[si], lt = t - S.start, d = S.dur;
  O.setTransform(1, 0, 0, 1, 0, 0); O.globalAlpha = 1; O.globalCompositeOperation = 'source-over'; O.shadowBlur = 0; O.letterSpacing = '0px';
  O.clearRect(0, 0, W, H);
  SCENES[S.key](O, t, lt, S);
  // Übergänge: Rein-Zoom + Zoom-Blur am Ende
  let sc = 1, blur = 0;
  if (si > 0) { const k = lt / .28; if (k < 1) { sc *= 1 + .35 * Math.pow(1 - k, 2); blur = Math.max(blur, 1 - k); } flash(lt, 0, .14, .7); }
  const ke = (d - lt) / .22; if (ke < 1 && si < TL.scenes.length - 1) { sc *= 1 + .25 * Math.pow(1 - ke, 2); blur = Math.max(blur, 1 - ke); }
  const sx = SHAKE * (Math.sin(t * 91) * .6 + Math.sin(t * 57) * .4), sy = SHAKE * (Math.cos(t * 83) * .6 + Math.sin(t * 41) * .4);
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  X.save(); X.translate(CX + sx, 960 + sy); X.rotate(SHAKE * .0006 * Math.sin(t * 70)); X.scale(sc * (1 + SHAKE * .002), sc * (1 + SHAKE * .002)); X.drawImage(OFF, -CX, -960);
  if (blur > .02) { for (let i = 1; i <= 4; i++) { X.globalAlpha = .22 * blur; const s2 = 1 + i * .035 * blur; X.drawImage(OFF, -CX * s2, -960 * s2, W * s2, H * s2); } }
  X.restore(); X.globalAlpha = 1;
  X.drawImage(VIGN, 0, 0);
  X.globalAlpha = .06; X.globalCompositeOperation = 'overlay'; X.drawImage(GRAIN[Math.floor(t * 30) % 3], 0, 0, W, H); X.globalCompositeOperation = 'source-over'; X.globalAlpha = 1;
  if (FLASH > 0) { X.fillStyle = `rgba(${FLASHCOL},${FLASH})`; X.fillRect(0, 0, W, H); }
  X.save(); X.translate(sx * .3, sy * .3); drawCaptions(X, t, si); X.restore();
};
